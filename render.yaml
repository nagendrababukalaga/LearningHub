services:
  - type: web
    name: learninghub
    runtime: python
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn learninghub.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: learninghub-db
          property: connectionString
      - key: SEED_DATABASE
        value: "true"
      - key: AI_PROVIDER
        value: "fallback"

databases:
  - name: learninghub-db
    plan: free
    databaseName: learninghub
    user: learninghub
